<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account {{ duid }} — Fraud Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #f7f6f3;
      --surface:   #ffffff;
      --surface2:  #f2f0ec;
      --border:    #e8e5e0;
      --border-strong: #ccc9c3;
      --text:      #181612;
      --text-2:    #5a564f;
      --text-3:    #9b9690;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'DM Sans', system-ui, sans-serif;
      --red:       #c8322b;
      --red-bg:    rgba(200,50,43,0.08);
      --red-border:rgba(200,50,43,0.2);
      --amber:     #b45309;
      --amber-bg:  rgba(180,83,9,0.08);
      --green:     #15803d;
      --green-bg:  rgba(21,128,61,0.08);
      --blue:      #1d4ed8;
      --blue-bg:   rgba(29,78,216,0.08);
      --topbar-h:  56px;
    }

    html { font-size: 14px; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: #13120e;
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 200;
      border-bottom: 1px solid #2a2820;
    }
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: #8a8479;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 6px 12px 6px 8px;
      border-radius: 6px;
      border: 1px solid #2a2820;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .topbar-back:hover { background: #1e1d19; color: #d4cfc7; border-color: #3a3830; }
    .topbar-divider { width: 1px; height: 20px; background: #2a2820; margin: 0 16px; }
    .topbar-crumb { font-size: 11px; color: #524f48; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
    .topbar-crumb-sep { color: #2a2820; margin: 0 8px; }
    .topbar-crumb-current { color: #8a8479; font-family: var(--mono); }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .topbar-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid #2a2820; background: none;
      color: #6b6760; transition: all 0.15s; white-space: nowrap;
      font-family: var(--sans);
    }
    .topbar-btn:hover { background: #1e1d19; color: #c4bfb8; border-color: #3a3830; }
    .topbar-copied { color: #15803d !important; border-color: #166534 !important; }

    /* ── PAGE ── */
    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: calc(var(--topbar-h) + 32px) 32px 64px;
    }

    /* ── HERO ── */
    .hero {
      margin-bottom: 28px;
      animation: fadeIn 0.2s ease both;
    }
    .hero-top {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }
    .hero-main { flex: 1; min-width: 0; }
    .hero-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 6px;
    }
    .hero-email {
      font-size: 22px;
      font-weight: 600;
      word-break: break-all;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .hero-duid {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.04em;
    }

    .risk-display {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 10px;
      border: 2px solid;
    }
    .risk-display.high   { border-color: var(--red);   background: var(--red-bg); }
    .risk-display.medium { border-color: var(--amber); background: var(--amber-bg); }
    .risk-display.low    { border-color: var(--green); background: var(--green-bg); }
    .risk-display-num {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .risk-display.high   .risk-display-num { color: var(--red); }
    .risk-display.medium .risk-display-num { color: var(--amber); }
    .risk-display.low    .risk-display-num { color: var(--green); }
    .risk-display-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .risk-display.high   .risk-display-label { color: var(--red); }
    .risk-display.medium .risk-display-label { color: var(--amber); }
    .risk-display.low    .risk-display-label { color: var(--green); }

    /* ── FLAGS STRIP ── */
    .flags-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .flag-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-border);
      border-radius: 5px;
      padding: 4px 10px;
    }
    .flag-chip::before {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── TWO COLUMN LAYOUT ── */
    .cols {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }
    .col-left {}
    .col-right {}

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      animation: fadeIn 0.25s ease both;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      background: #faf9f6;
    }
    .card-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .card-count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }
    .card-body { padding: 0; }

    /* ── FIELDS GRID ── */
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .field-cell {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .field-cell:nth-child(2n) { border-right: none; }
    .field-cell:nth-last-child(-n+2) { border-bottom: none; }
    /* Odd count — last item spans 2 */
    .field-cell.span2 { grid-column: 1 / -1; border-right: none; }
    .field-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 5px;
    }
    .field-value {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      word-break: break-all;
      line-height: 1.4;
    }
    .field-value a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
    }
    .field-value a:hover { text-decoration: underline; }
    .field-value.mono { font-family: var(--mono); font-size: 11.5px; }
    .field-empty { color: var(--text-3); }

    /* ── OUTCOME HISTORY ── */
    .outcome-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .outcome-row:last-child { border-bottom: none; }
    .outcome-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 100px;
    }
    .outcome-badge.confirmed_fraud { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .outcome-badge.false_positive  { background: var(--green-bg); color: var(--green); border: 1px solid rgba(21,128,61,0.2); }
    .outcome-badge.under_review    { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(180,83,9,0.2); }
    .outcome-notes { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .outcome-date  { font-size: 11px; color: var(--text-3); white-space: nowrap; font-family: var(--mono); }

    /* ── RELATED ACCOUNTS ── */
    .related-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background 0.12s;
    }
    .related-row:last-child { border-bottom: none; }
    .related-row:hover { background: #f5f3ef; }
    .related-email {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .related-aff { font-size: 10px; color: var(--text-3); margin-top: 2px; }
    .related-score {
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ── ACTION PANEL ── */
    .action-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      animation: fadeIn 0.3s ease both;
    }
    .action-panel-head {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      background: #faf9f6;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-2);
    }
    .action-panel-body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .action-btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 7px;
      border: 1px solid;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .action-btn.fraud  {
      background: var(--red-bg); color: var(--red);
      border-color: var(--red-border);
    }
    .action-btn.fraud:hover  { background: rgba(200,50,43,0.15); }
    .action-btn.fp     {
      background: var(--green-bg); color: var(--green);
      border-color: rgba(21,128,61,0.2);
    }
    .action-btn.fp:hover     { background: rgba(21,128,61,0.13); }
    .action-btn.review {
      background: var(--amber-bg); color: var(--amber);
      border-color: rgba(180,83,9,0.2);
    }
    .action-btn.review:hover { background: rgba(180,83,9,0.13); }
    .action-confirm {
      font-size: 11px;
      color: var(--green);
      font-weight: 600;
      text-align: center;
      padding: 4px 0;
      animation: fadeIn 0.2s ease;
    }

    /* ── NOTES INPUT ── */
    .notes-area {
      width: 100%;
      padding: 8px 10px;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      resize: vertical;
      min-height: 64px;
      outline: none;
      transition: border 0.15s;
    }
    .notes-area:focus { border-color: var(--blue); }
    .notes-area::placeholder { color: var(--text-3); }
    .notes-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 6px; }

    /* ── STATES ── */
    .page-loading {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 40vh; gap: 14px; color: var(--text-3);
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .empty-hint {
      padding: 20px 18px;
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 780px) {
      .cols { grid-template-columns: 1fr; }
      .col-right { order: -1; }
      .risk-display { width: 72px; height: 72px; }
      .risk-display-num { font-size: 24px; }
    }
    @media (max-width: 480px) {
      .page { padding: calc(var(--topbar-h) + 20px) 14px 48px; }
      .topbar-crumb { display: none; }
      .hero-email { font-size: 17px; }
    }
  </style>
</head>
<body>

<!-- ── FIXED TOP BAR ── -->
<header class="topbar">
  <a class="topbar-back" href="/">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M9 11L5 7L9 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Dashboard
  </a>
  <div class="topbar-divider"></div>
  <div class="topbar-crumb">
    <span>Accounts</span>
    <span class="topbar-crumb-sep">/</span>
    <span class="topbar-crumb-current" id="topbarDuid">—</span>
  </div>
  <div class="topbar-actions">
    <button class="topbar-btn" id="copyBtn" onclick="copyLink()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 3H3a1 1 0 00-1 1v5a1 1 0 001 1h5a1 1 0 001-1v-1.5M7 1h3v3M9.5 2.5L5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Copy Link
    </button>
  </div>
</header>

<div class="page" id="page">
  <div class="page-loading">
    <div class="spinner"></div>
    <span>Loading account…</span>
  </div>
</div>

<script>
const DUID = {{ duid | tojson }};
document.getElementById('topbarDuid').textContent = DUID;

async function loadAccount() {
  let data, err;
  try {
    const r = await fetch(`/api/account/${encodeURIComponent(DUID)}`);
    const j = await r.json();
    if (!r.ok) err = j.error || `HTTP ${r.status}`;
    else data = j;
  } catch(e) { err = e.message; }

  if (err) {
    document.getElementById('page').innerHTML = `
      <div class="page-loading" style="color:var(--red);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Failed to load: ${err}</span>
        <a href="/" style="font-size:12px;color:var(--blue);text-decoration:none;">← Back to dashboard</a>
      </div>`;
    return;
  }

  const acct     = data.account         || {};
  const outcomes = data.outcomes         || [];
  const relEmail = data.related_by_email || [];
  const relIp    = data.related_by_ip    || [];
  const ipGeo    = data.ip_geo           || {};
  const admin    = data.admin            || null;

  const risk      = acct.risk_score ?? null;
  const riskClass = risk >= 50 ? 'high' : risk >= 25 ? 'medium' : 'low';
  const riskLabel = riskClass === 'high' ? 'HIGH' : riskClass === 'medium' ? 'MED' : 'LOW';

  let flags = [];
  try { flags = JSON.parse((acct.flags || '[]').replace(/'/g, '"')); }
  catch { if (acct.flags) flags = [acct.flags]; }

  document.title = `${acct.email || DUID} — Account Detail`;
  document.getElementById('topbarDuid').textContent = DUID;

  const fieldVal = (v, cls='') => v
    ? `<span class="${cls}">${v}</span>`
    : `<span class="field-empty">—</span>`;

  const relScoreColor = s => s >= 50 ? 'var(--red)' : s >= 25 ? 'var(--amber)' : 'var(--green)';

  document.getElementById('page').innerHTML = `
    <!-- Hero -->
    <div class="hero">
      <div class="hero-top">
        <div class="hero-main">
          <div class="hero-label">Member Account</div>
          <div class="hero-email">${acct.email || 'No email'}</div>
          <div class="hero-duid">DUID: ${acct.duid || DUID}</div>
          ${flags.length > 0 ? `
          <div class="flags-strip" style="margin-top:14px;">
            ${flags.map(f => `<span class="flag-chip">${String(f).replace(/_/g,' ')}</span>`).join('')}
          </div>` : ''}
        </div>
        ${risk != null ? `
        <div class="risk-display ${riskClass}">
          <div class="risk-display-num">${risk}</div>
          <div class="risk-display-label">${riskLabel} RISK</div>
        </div>` : ''}
      </div>
    </div>

    <div class="cols">
      <!-- LEFT COLUMN -->
      <div class="col-left">

        <!-- Account Details -->
        <div class="card" style="animation-delay:0.05s">
          <div class="card-head">
            <span class="card-title">Account Details</span>
            ${acct.data_type ? `<span class="card-count" style="text-transform:capitalize;">${acct.data_type} account</span>` : ''}
          </div>
          <div class="card-body">
            <div class="fields-grid">
              <div class="field-cell">
                <div class="field-label">Affiliate</div>
                <div class="field-value">
                  ${acct.webmaster_code
                    ? `<a href="/affiliate/${encodeURIComponent(acct.webmaster_code)}">${acct.webmaster_code} ↗</a>`
                    : '<span class="field-empty">—</span>'}
                </div>
              </div>
              <div class="field-cell">
                <div class="field-label">Campaign</div>
                <div class="field-value mono">${fieldVal(acct.campaign)}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Ad ID</div>
                <div class="field-value mono">${fieldVal(acct.ad_id)}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Payout</div>
                <div class="field-value">${acct.payout_amount != null ? `$${Number(acct.payout_amount).toFixed(2)}` : '<span class="field-empty">—</span>'}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">IP Address</div>
                <div class="field-value mono">${fieldVal(acct.ip)}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Location</div>
                <div class="field-value">
                  ${(ipGeo.city || ipGeo.region || ipGeo.country)
                    ? [ipGeo.city, ipGeo.region, ipGeo.country].filter(Boolean).join(', ')
                    : fieldVal(acct.geo_country)}
                </div>
              </div>
              <div class="field-cell">
                <div class="field-label">ISP</div>
                <div class="field-value" style="font-size:11px;">${fieldVal(ipGeo.isp || null)}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Organization</div>
                <div class="field-value" style="font-size:11px;">${fieldVal(ipGeo.org && ipGeo.org !== ipGeo.isp ? ipGeo.org : null)}</div>
              </div>
              ${(ipGeo.proxy || ipGeo.hosting) ? `
              <div class="field-cell" style="grid-column:span 2">
                <div class="field-label">IP Flags</div>
                <div class="field-value" style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${ipGeo.proxy   ? '<span style="background:rgba(239,68,68,0.1);color:var(--red);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;">PROXY</span>' : ''}
                  ${ipGeo.hosting ? '<span style="background:rgba(245,158,11,0.1);color:var(--amber);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;">HOSTING / DATACENTER</span>' : ''}
                </div>
              </div>` : ''}
              <div class="field-cell">
                <div class="field-label">Gender (u1)</div>
                <div class="field-value">${fieldVal(acct.custom_u1)}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Analyzed</div>
                <div class="field-value mono" style="font-size:11px;">${acct.analyzed_at ? new Date(acct.analyzed_at).toLocaleString() : '<span class="field-empty">—</span>'}</div>
              </div>
              <div class="field-cell">
                <div class="field-label">Source</div>
                <div class="field-value" style="text-transform:capitalize;">${fieldVal(acct.source)}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Review History -->
        ${outcomes.length > 0 ? `
        <div class="card" style="animation-delay:0.1s">
          <div class="card-head">
            <span class="card-title">Review History</span>
            <span class="card-count">${outcomes.length}</span>
          </div>
          <div class="card-body">
            ${outcomes.map(o => `
              <div class="outcome-row">
                <div>
                  <span class="outcome-badge ${o.outcome}">${o.outcome.replace(/_/g,' ')}</span>
                  ${o.notes ? `<div class="outcome-notes">${o.notes}</div>` : ''}
                </div>
                <span class="outcome-date">${o.recorded_at ? new Date(o.recorded_at).toLocaleDateString() : ''}</span>
              </div>`).join('')}
          </div>
        </div>` : ''}

        <!-- Related by email -->
        ${relEmail.length > 0 ? `
        <div class="card" style="animation-delay:0.12s">
          <div class="card-head">
            <span class="card-title">Related by Email Pattern</span>
            <span class="card-count">${relEmail.length}</span>
          </div>
          <div class="card-body">
            ${relEmail.map(r => `
              <a class="related-row" href="/account/${encodeURIComponent(r.duid)}">
                <div>
                  <div class="related-email">${r.email}</div>
                  <div class="related-aff">${r.webmaster_code || ''}</div>
                </div>
                <span class="related-score" style="color:${relScoreColor(r.risk_score)}">${r.risk_score}</span>
              </a>`).join('')}
          </div>
        </div>` : ''}

        <!-- Related by IP -->
        ${relIp.length > 0 ? `
        <div class="card" style="animation-delay:0.14s">
          <div class="card-head">
            <span class="card-title">Related by IP Address</span>
            <span class="card-count">${relIp.length}</span>
          </div>
          <div class="card-body">
            ${relIp.map(r => `
              <a class="related-row" href="/account/${encodeURIComponent(r.duid)}">
                <div>
                  <div class="related-email">${r.email}</div>
                  <div class="related-aff">${r.webmaster_code || ''}</div>
                </div>
                <span class="related-score" style="color:${relScoreColor(r.risk_score)}">${r.risk_score}</span>
              </a>`).join('')}
          </div>
        </div>` : ''}

        ${admin && !admin.error ? renderAdminSection(admin) : admin && admin.error ? `
        <div class="card" style="animation-delay:0.16s">
          <div class="card-head"><span class="card-title">Platform Data</span></div>
          <div class="card-body"><div class="empty-hint">Could not load: ${admin.error}</div></div>
        </div>` : ''}

      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-right">
        <div class="action-panel" style="animation-delay:0.08s">
          <div class="action-panel-head">Record Decision</div>
          <div class="action-panel-body">
            <div>
              <div class="notes-label">Notes (optional)</div>
              <textarea class="notes-area" id="actionNotes" placeholder="Add context, findings, or reason…"></textarea>
            </div>
            <button class="action-btn fraud"  onclick="markOutcome('confirmed_fraud')">🚨 Confirm Fraud</button>
            <button class="action-btn review" onclick="markOutcome('under_review')">🔍 Under Review</button>
            <button class="action-btn fp"     onclick="markOutcome('false_positive')">✓ False Positive</button>
            <div id="actionConfirm" style="display:none;" class="action-confirm"></div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderAdminSection(a) {
  const u = a.user || {};
  const img = a.profile_image_upload || {};
  const shared = a.shared_payment_methods || [];

  const ts = (v) => v ? new Date(v).toLocaleString() : '—';

  // Registration & Login IPs
  const regFields = `
    <div class="field-cell">
      <div class="field-label">Registered</div>
      <div class="field-value mono" style="font-size:11px;">${ts(u.registration_timestamp)}</div>
    </div>
    <div class="field-cell">
      <div class="field-label">Registration IP</div>
      <div class="field-value mono">${u.registration_ip || '—'}</div>
    </div>
    <div class="field-cell">
      <div class="field-label">First Login</div>
      <div class="field-value mono" style="font-size:11px;">${u.first_login ? ts(u.first_login.timestamp) : '—'}</div>
    </div>
    <div class="field-cell">
      <div class="field-label">First Login IP</div>
      <div class="field-value mono">${u.first_login ? u.first_login.ip || '—' : '—'}</div>
    </div>
    <div class="field-cell">
      <div class="field-label">Last Login</div>
      <div class="field-value mono" style="font-size:11px;">${u.last_login ? ts(u.last_login.timestamp) : '—'}</div>
    </div>
    <div class="field-cell">
      <div class="field-label">Last Login IP</div>
      <div class="field-value mono">${u.last_login ? u.last_login.ip || '—' : '—'}</div>
    </div>`;

  // IP mismatch warning
  let ipWarn = '';
  if (u.registration_ip && u.first_login && u.first_login.ip && u.registration_ip !== u.first_login.ip) {
    ipWarn = `<div class="field-cell span2" style="background:rgba(200,50,43,0.04);">
      <div class="field-label" style="color:var(--red);">IP Mismatch</div>
      <div class="field-value" style="font-size:11px;color:var(--red);">
        Registration IP (${u.registration_ip}) differs from first login IP (${u.first_login.ip})
      </div>
    </div>`;
  }

  // Profile image — API may use occurred/first_upload_at, uploaded/uploaded_at, exists, counts, etc.
  const imgCount = (() => {
    const n = img.image_count ?? img.images_count ?? img.photo_count;
    if (typeof n === 'number' && !isNaN(n)) return n;
    if (Array.isArray(img.images)) return img.images.length;
    if (Array.isArray(img.photos)) return img.photos.length;
    return null;
  })();
  const hasProfileImage = !!(
    img.occurred
    || img.uploaded === true
    || img.exists === true
    || img.has_image === true
    || img.hasImage === true
    || (typeof imgCount === 'number' && imgCount > 0)
  );
  const imgWhen = img.first_upload_at || img.uploaded_at || img.timestamp || img.created_at || img.at;
  const imgStatus = hasProfileImage
    ? `<span style="color:var(--green);font-weight:600;">Uploaded</span>${imgWhen ? ` — ${ts(imgWhen)}` : ''}${imgCount != null && imgCount > 1 ? ` <span style="color:var(--text-3);font-weight:400;">(${imgCount} photos)</span>` : ''}`
    : `<span style="color:var(--red);font-weight:600;">No image uploaded</span>`;

  // Shared payment methods
  let sharedHtml = '';
  if (shared.length > 0) {
    const cards = shared.map(pm => {
      const duids = (pm.other_duids || [])
        .filter((x) => x != null && x !== '')
        .map((x) => String(x).trim())
        .filter((s) => s && !['null', 'undefined', 'none'].includes(s.toLowerCase()));
      const count = duids.length;
      const riskLevel = count >= 5 ? 'high' : count >= 3 ? 'medium' : 'low';
      const riskColor = riskLevel === 'high' ? 'var(--red)' : riskLevel === 'medium' ? 'var(--amber)' : 'var(--green)';
      const fp = pm.card_fingerprint || '—';
      const fpShort = fp.length > 16 ? fp.slice(0, 8) + '…' + fp.slice(-8) : fp;
      const duidLinks = duids.slice(0, 20).map(d =>
        `<a href="/account/${encodeURIComponent(d)}" style="color:var(--blue);text-decoration:none;font-family:var(--mono);font-size:11px;">${d}</a>`
      ).join(', ');
      const more = duids.length > 20 ? ` <span style="color:var(--text-3);font-size:11px;">+ ${duids.length - 20} more</span>` : '';
      return `<div style="padding:12px 18px;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-family:var(--mono);font-size:11px;color:var(--text-3);">${fpShort}</span>
          <span style="font-size:11px;font-weight:700;color:${riskColor};">${count} account${count !== 1 ? 's' : ''} sharing this card</span>
        </div>
        <div style="line-height:1.8;">${duidLinks}${more}</div>
      </div>`;
    }).join('');
    sharedHtml = cards;
  } else {
    sharedHtml = '<div class="empty-hint">No shared payment methods found</div>';
  }

  return `
    <!-- Registration & Login (from admin API) -->
    <div class="card" style="animation-delay:0.16s">
      <div class="card-head">
        <span class="card-title">Registration & Login</span>
        <span class="card-count" style="font-size:10px;color:var(--text-3);">via platform API</span>
      </div>
      <div class="card-body">
        <div class="fields-grid">
          ${regFields}
          ${ipWarn}
          <div class="field-cell span2">
            <div class="field-label">Profile Image</div>
            <div class="field-value">${imgStatus}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Shared Payment Methods -->
    <div class="card" style="animation-delay:0.18s">
      <div class="card-head">
        <span class="card-title">Shared Payment Methods</span>
        <span class="card-count">${shared.length} card${shared.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="card-body">${sharedHtml}</div>
    </div>
  `;
}

async function markOutcome(outcome) {
  const notes = document.getElementById('actionNotes')?.value?.trim() || '';
  const r = await fetch('/api/outcomes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ duid: DUID, outcome, notes })
  });
  const j = await r.json();
  if (!r.ok) {
    const c = document.getElementById('actionConfirm');
    if (c) { c.style.display = 'block'; c.style.color = 'var(--red)'; c.textContent = `Error: ${j.error || 'Unknown error'}`; }
    return;
  }
  const c = document.getElementById('actionConfirm');
  if (c) {
    c.style.display = 'block';
    c.style.color = 'var(--green)';
    c.textContent = `✓ Recorded: ${outcome.replace(/_/g, ' ')}`;
    setTimeout(() => loadAccount(), 1500);
  }
}

function copyLink() {
  const btn = document.getElementById('copyBtn');
  navigator.clipboard.writeText(window.location.href).then(() => {
    btn.classList.add('topbar-copied');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Copied`;
    setTimeout(() => {
      btn.classList.remove('topbar-copied');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 3H3a1 1 0 00-1 1v5a1 1 0 001-1v-1.5M7 1h3v3M9.5 2.5L5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Copy Link`;
    }, 2000);
  });
}

loadAccount();
</script>
</body>
</html>
