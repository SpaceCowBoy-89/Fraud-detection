<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluster Investigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Tokens ───────────────────────────────────────── */
    :root {
      --bg:          #0a0b0d;
      --bg-card:     #0f1114;
      --bg-raised:   #141619;
      --bg-hover:    #1a1d21;
      --border:      rgba(255,255,255,0.07);
      --border-hi:   rgba(255,255,255,0.14);
      --text:        #e8eaed;
      --text-muted:  #6b7280;
      --text-dim:    #3d4451;
      --accent:      #3b82f6;
      --accent-glow: rgba(59,130,246,0.08);
      --green:       #22c55e;
      --green-bg:    rgba(34,197,94,0.08);
      --amber:       #f59e0b;
      --amber-bg:    rgba(245,158,11,0.08);
      --red:         #ef4444;
      --red-bg:      rgba(239,68,68,0.08);
      --mono:        'IBM Plex Mono', monospace;
      --display:     'Syne', sans-serif;
    }

    /* ── Reset ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Top nav bar ─────────────────────────────────── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,11,13,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0;
      height: 48px;
    }
    .topbar-back {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      height: 100%;
      border-right: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .topbar-back:hover { color: var(--text); background: var(--bg-hover); }
    .topbar-back svg { opacity: 0.6; }
    .topbar-type-badge {
      padding: 0 16px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      border-right: 1px solid var(--border);
    }
    .type-icon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .type-icon.ip       { background: rgba(59,130,246,0.15); color: var(--accent); }
    .type-icon.domain   { background: rgba(245,158,11,0.15); color: var(--amber);  }
    .type-icon.name     { background: rgba(239,68,68,0.15);  color: var(--red);    }
    .type-icon.affiliate { background: rgba(34,197,94,0.15); color: var(--green);  }
    .type-label {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .topbar-id {
      padding: 0 20px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
    }
    .topbar-btn {
      padding: 6px 14px;
      border-radius: 5px;
      border: 1px solid var(--border-hi);
      background: transparent;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .topbar-btn:hover { color: var(--text); border-color: var(--border-hi); background: var(--bg-hover); }
    .topbar-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .topbar-btn.primary:hover { background: #2563eb; }

    /* ── Page layout ─────────────────────────────────── */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── Hero section ────────────────────────────────── */
    .hero {
      margin-bottom: 32px;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-label {
      font-family: var(--display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hero-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .hero-id {
      font-family: var(--display);
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
      word-break: break-all;
      margin-bottom: 12px;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 11px;
    }
    .hero-meta-sep { color: var(--text-dim); }

    /* ── KPI strip ───────────────────────────────────── */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 32px;
      animation: fadeUp 0.4s 0.05s ease both;
    }
    .kpi-cell {
      background: var(--bg-card);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-family: var(--display);
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 600;
      font-family: var(--display);
      color: var(--text);
      line-height: 1;
    }
    .kpi-value.danger { color: var(--red); }
    .kpi-value.warn   { color: var(--amber); }
    .kpi-value.safe   { color: var(--green); }
    .kpi-sub {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── Two-column layout ───────────────────────────── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
      animation: fadeUp 0.4s 0.1s ease both;
    }
    @media (max-width: 860px) {
      .two-col { grid-template-columns: 1fr; }
    }

    /* ── Section card ────────────────────────────────── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .card-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      padding: 2px 8px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    /* ── Accounts table ──────────────────────────────── */
    .accounts-table-wrap {
      overflow-x: auto;
    }
    .accounts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .accounts-table thead th {
      font-family: var(--display);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
      background: var(--bg-raised);
    }
    .accounts-table thead th.right { text-align: right; }
    .accounts-table tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .accounts-table tbody tr:last-child { border-bottom: none; }
    .accounts-table tbody tr:hover { background: var(--bg-hover); }
    .accounts-table tbody tr:hover .row-arrow { opacity: 1; }
    .accounts-table tbody td {
      padding: 11px 16px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .accounts-table tbody td.right { text-align: right; max-width: none; }
    .accounts-table tbody td.muted { color: var(--text-muted); }
    .row-arrow {
      opacity: 0;
      color: var(--text-muted);
      font-size: 10px;
      transition: opacity 0.1s;
    }

    /* ── Risk badge ──────────────────────────────────── */
    .risk-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--display);
    }
    .risk-chip.high   { background: var(--red-bg);   color: var(--red);   }
    .risk-chip.medium { background: var(--amber-bg); color: var(--amber); }
    .risk-chip.low    { background: var(--green-bg); color: var(--green); }
    .risk-chip.none   { background: var(--bg-raised); color: var(--text-muted); }

    /* ── Flag chips ──────────────────────────────────── */
    .flag-chip {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
      border-radius: 3px;
      font-size: 10px;
      margin: 2px 2px 2px 0;
      white-space: nowrap;
    }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar { }
    .sidebar .card { margin-bottom: 16px; }

    /* Flag breakdown bars */
    .flag-bar-item {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .flag-bar-item:last-child { border-bottom: none; }
    .flag-bar-name {
      font-size: 11px;
      color: var(--text-muted);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: lowercase;
    }
    .flag-bar-track {
      width: 80px;
      height: 3px;
      background: var(--bg-raised);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .flag-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--red);
      transition: width 0.6s ease;
    }
    .flag-bar-count {
      font-size: 10px;
      color: var(--text-muted);
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Quick-facts list */
    .fact-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .fact-row:last-child { border-bottom: none; }
    .fact-key {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--display);
      font-weight: 600;
    }
    .fact-val {
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
    }

    /* ── Search bar ──────────────────────────────────── */
    .search-row {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-row input {
      flex: 1;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 7px 12px;
      border-radius: 5px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--text-muted); }
    .search-row select {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }
    .search-row select:focus { border-color: var(--accent); }
    .result-count {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Risk breakdown bar ──────────────────────────── */
    .risk-breakdown {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    .risk-bar-track {
      height: 6px;
      background: var(--bg-raised);
      border-radius: 3px;
      overflow: hidden;
      display: flex;
      gap: 1px;
    }
    .risk-bar-high   { background: var(--red);   }
    .risk-bar-medium { background: var(--amber); }
    .risk-bar-low    { background: var(--green); }
    .risk-bar-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 10px;
    }
    .risk-bar-labels span { color: var(--text-muted); }

    /* ── Verdict banner ──────────────────────────────── */
    .verdict-banner {
      margin-bottom: 24px;
      padding: 14px 20px;
      border-radius: 8px;
      border-left: 3px solid;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: fadeUp 0.4s 0.02s ease both;
    }
    .verdict-banner.critical { background: var(--red-bg);   border-color: var(--red);   }
    .verdict-banner.warning  { background: var(--amber-bg); border-color: var(--amber); }
    .verdict-banner.clean    { background: var(--green-bg); border-color: var(--green); }
    .verdict-icon { font-size: 18px; flex-shrink: 0; }
    .verdict-text { flex: 1; }
    .verdict-title { font-family: var(--display); font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .verdict-desc  { font-size: 11px; color: var(--text-muted); }

    /* ── Divider ─────────────────────────────────────── */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* ── Loading / error ─────────────────────────────── */
    .state-box {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .state-box .state-icon { font-size: 28px; margin-bottom: 12px; }
    .state-box .state-title { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .state-box .state-desc  { font-size: 12px; }

    /* ── Spinner ─────────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    /* ── Export btn ─────────────────────────────────── */
    .export-hint { font-size: 10px; color: var(--text-dim); }

    /* ── Aff link in table ────────────────────────────── */
    .aff-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 11px;
      opacity: 0.8;
      padding: 1px 5px;
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 3px;
      transition: opacity 0.12s;
    }
    .aff-link:hover { opacity: 1; }

    /* ── Sort indicators ─────────────────────────────── */
    th[data-sort] { cursor: pointer; user-select: none; }
    th[data-sort]:hover { color: var(--text); }
    th.sorted-asc::after  { content: ' ▲'; font-size: 8px; color: var(--accent); }
    th.sorted-desc::after { content: ' ▼'; font-size: 8px; color: var(--accent); }
  </style>
</head>
<body>

<!-- ── Top navigation ─────────────────────────────────── -->
<nav class="topbar">
  <a class="topbar-back" href="javascript:void(0)" onclick="history.length > 1 ? history.back() : (window.location='/')">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <path d="M8 2L4 6l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Back
  </a>
  <div class="topbar-type-badge">
    <div class="type-icon" id="typeIcon"></div>
    <span class="type-label" id="typeLabel"></span>
  </div>
  <div class="topbar-id" id="topbarId">Loading…</div>
  <div class="topbar-actions">
    <button class="topbar-btn" onclick="copyLink()" title="Copy page URL">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 2H6C4.895 2 4 2.895 4 4v8c0 1.105.895 2 2 2h6c1.105 0 2-.895 2-2V6l-4-4z" stroke="currentColor" stroke-width="1.3"/><path d="M10 2v4h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      Copy Link
    </button>
    <button class="topbar-btn" onclick="exportCSV()" title="Export accounts to CSV">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M3 12h10M8 3v7m-3-3 3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Export CSV
    </button>
    <a class="topbar-btn" href="/" style="text-decoration:none;">Dashboard</a>
  </div>
</nav>

<!-- ── Page body ──────────────────────────────────────── -->
<div class="page-wrap" id="pageWrap">
  <div class="state-box">
    <div><div class="spinner"></div></div>
    <div class="state-desc" style="margin-top:12px;">Loading cluster data…</div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────────── -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
     background:var(--bg-raised);border:1px solid var(--border-hi);color:var(--text);
     padding:10px 20px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;
     transition:all 0.2s;z-index:9999;white-space:nowrap;"></div>

<script>
  /* ── Config ─────────────────────────────────────────── */
  const CLUSTER_TYPE = '{{ cluster_type }}';
  const CLUSTER_ID   = '{{ cluster_id }}';

  const TYPE_META = {
    ip:        { icon: '⊕', label: 'IP Cluster',        color: 'var(--accent)', desc: 'Accounts sharing a registration IP address' },
    domain:    { icon: '◉', label: 'Domain Cluster',     color: 'var(--amber)',  desc: 'Accounts registered with the same email domain' },
    name:      { icon: '⊞', label: 'Name Correlation',   color: 'var(--red)',    desc: 'Paid accounts sharing a billing name' },
    affiliate: { icon: '⊿', label: 'Affiliate Cluster',  color: 'var(--green)',  desc: 'Accounts from the same affiliate source' },
  };

  /* ── Init ────────────────────────────────────────────── */
  let _allAccounts = [];
  let _filteredAccounts = [];
  let _sortKey = 'risk_score';
  let _sortDir = -1;
  let _pagination = { page: 1, per_page: 100, total: 0, total_pages: 1 };

  document.addEventListener('DOMContentLoaded', () => {
    const meta = TYPE_META[CLUSTER_TYPE] || TYPE_META.ip;

    // Top bar
    const typeIcon = document.getElementById('typeIcon');
    typeIcon.textContent = meta.icon;
    typeIcon.classList.add(CLUSTER_TYPE);
    document.getElementById('typeLabel').textContent = meta.label;
    document.getElementById('topbarId').textContent = CLUSTER_ID;
    document.title = `${meta.label}: ${CLUSTER_ID}`;

    fetchData();
  });

  /* ── Fetch ───────────────────────────────────────────── */
  async function fetchData(page) {
    const p = (page === undefined || page === null) ? 1 : Math.max(1, parseInt(page, 10) || 1);
    const url = `/api/cluster-detail/${CLUSTER_TYPE}/${encodeURIComponent(CLUSTER_ID)}?page=${p}&per_page=${_pagination.per_page || 100}`;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (json.error) {
        showError(json.error);
        return;
      }
      _pagination = json.pagination || { page: p, per_page: 100, total: 0, total_pages: 1 };
      _allAccounts = json.accounts || [];
      _filteredAccounts = [..._allAccounts];
      render(json.summary || {}, json.flag_breakdown || {});
    } catch (e) {
      showError(e.message);
    }
  }

  function changeClusterPage(delta) {
    const next = (_pagination.page || 1) + delta;
    if (next < 1 || next > (_pagination.total_pages || 1)) return;
    fetchData(next);
  }

  function changePerPage(ev) {
    const sel = (ev && ev.target) ? ev.target : document.getElementById('clusterPerPage');
    const v = parseInt(sel && sel.value, 10);
    if (v >= 10 && v <= 500) {
      _pagination.per_page = v;
      fetchData(1);
    }
  }

  /* ── Main render ─────────────────────────────────────── */
  function render(summary, flags) {
    const meta = TYPE_META[CLUSTER_TYPE] || TYPE_META.ip;
    const total    = summary.total_accounts || 0;
    const high     = summary.high_risk      || 0;
    const med      = summary.medium_risk    || 0;
    const low      = total - high - med;
    const pct_high = total > 0 ? Math.round(high / total * 100) : 0;

    // Verdict
    let verdict;
    if (pct_high >= 50) {
      verdict = { cls: 'critical', icon: '⚠', title: 'High-Risk Cluster', desc: `${pct_high}% of accounts are high risk. Recommend immediate investigation.` };
    } else if (pct_high >= 20) {
      verdict = { cls: 'warning',  icon: '△', title: 'Elevated Risk',     desc: `${pct_high}% of accounts are high risk. Monitor closely.` };
    } else {
      verdict = { cls: 'clean',    icon: '✓', title: 'Low Risk Profile',  desc: `${pct_high}% high risk. No immediate action required.` };
    }

    // KPI data
    const kpis = [
      { label: 'Total Accounts', value: fmt(total), sub: meta.desc },
      { label: 'High Risk',      value: fmt(high),   sub: `${pct_high}% of total`, cls: high > 0 ? 'danger' : '' },
      { label: 'Medium Risk',    value: fmt(med),    sub: `${total > 0 ? Math.round(med/total*100) : 0}% of total`, cls: med > 0 ? 'warn' : '' },
      { label: 'Avg Risk Score', value: (summary.avg_risk || 0).toFixed(1), sub: 'across all accounts', cls: summary.avg_risk >= 50 ? 'danger' : summary.avg_risk >= 25 ? 'warn' : 'safe' },
      { label: 'Total Payout',   value: fmtCur(summary.total_payout || 0), sub: 'combined payout' },
    ];
    if (summary.unique_affiliates > 1) {
      kpis.push({ label: 'Affiliates',   value: fmt(summary.unique_affiliates), sub: 'distinct sources' });
    }
    if (summary.unique_ips > 1) {
      kpis.push({ label: 'Unique IPs',   value: fmt(summary.unique_ips),        sub: 'distinct IPs' });
    }
    if (summary.unique_cards != null) {
      kpis.push({ label: 'Unique Cards', value: fmt(summary.unique_cards),      sub: 'payment methods' });
    }

    // Flag sidebar
    const flagEntries = Object.entries(flags).sort((a, b) => b[1] - a[1]);
    const maxFlag = flagEntries[0]?.[1] || 1;

    const flagHtml = flagEntries.length === 0
      ? '<div class="state-box" style="padding:24px"><div class="state-desc">No flags recorded</div></div>'
      : flagEntries.map(([f, n]) => `
          <div class="flag-bar-item">
            <div class="flag-bar-name" title="${f}">${f.toLowerCase().replace(/_/g,' ')}</div>
            <div class="flag-bar-track"><div class="flag-bar-fill" style="width:${Math.round(n/maxFlag*100)}%"></div></div>
            <div class="flag-bar-count">${n}</div>
          </div>`).join('');

    // Quick facts
    const facts = [
      { key: 'Cluster Type',  val: meta.label },
      { key: 'Identifier',    val: CLUSTER_ID },
    ];
    if (CLUSTER_TYPE === 'affiliate') {
      facts.push({ key: 'Full Page', val: `<a class="aff-link" href="/affiliate/${encodeURIComponent(CLUSTER_ID)}" target="_blank">View Affiliate ↗</a>` });
    }
    if (CLUSTER_TYPE === 'ip') {
      facts.push({ key: 'Source IPs', val: summary.unique_ips > 0 ? `${summary.unique_ips} distinct` : '1' });
    }

    const factsHtml = facts.map(f => `
      <div class="fact-row">
        <span class="fact-key">${f.key}</span>
        <span class="fact-val">${f.val}</span>
      </div>`).join('');

    // Risk bar widths
    const hw = total > 0 ? (high/total*100).toFixed(1) : 0;
    const mw = total > 0 ? (med/total*100).toFixed(1) : 0;
    const lw = total > 0 ? (low/total*100).toFixed(1) : 0;

    document.getElementById('pageWrap').innerHTML = `
      <!-- Hero -->
      <div class="hero">
        <div class="hero-label">${meta.label}</div>
        <div class="hero-id">${escapeHtml(CLUSTER_ID)}</div>
        <div class="hero-meta">
          <span>${fmt(total)} account${total !== 1 ? 's' : ''}</span>
          <span class="hero-meta-sep">·</span>
          <span style="color:${high > 0 ? 'var(--red)' : 'var(--green)'}">
            ${high > 0 ? `${high} high risk` : 'No high-risk accounts'}
          </span>
          <span class="hero-meta-sep">·</span>
          <span>${fmtCur(summary.total_payout || 0)} payout</span>
        </div>
      </div>

      <!-- Verdict -->
      <div class="verdict-banner ${verdict.cls}">
        <div class="verdict-icon">${verdict.icon}</div>
        <div class="verdict-text">
          <div class="verdict-title">${verdict.title}</div>
          <div class="verdict-desc">${verdict.desc}</div>
        </div>
      </div>

      <!-- KPI strip -->
      <div class="kpi-strip">
        ${kpis.map(k => `
          <div class="kpi-cell">
            <div class="kpi-label">${k.label}</div>
            <div class="kpi-value ${k.cls || ''}">${k.value}</div>
            <div class="kpi-sub">${k.sub || ''}</div>
          </div>`).join('')}
      </div>

      <!-- Two-column -->
      <div class="two-col">
        <!-- Main: accounts table -->
        <div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Accounts</span>
              <span class="card-count" id="tableCount">${fmt(total)}</span>
            </div>
            <div class="risk-breakdown">
              <div class="risk-bar-track">
                <div class="risk-bar-high"   style="width:${hw}%"></div>
                <div class="risk-bar-medium" style="width:${mw}%"></div>
                <div class="risk-bar-low"    style="width:${lw}%"></div>
              </div>
              <div class="risk-bar-labels">
                <span style="color:var(--red)">${high} high</span>
                <span style="color:var(--amber)">${med} medium</span>
                <span style="color:var(--green)">${Math.max(0,low)} low</span>
              </div>
            </div>
            <div class="search-row">
              <input type="text" id="searchInput" placeholder="Filter by email, DUID, affiliate…"
                     oninput="filterAndRender()">
              <select id="riskFilter" onchange="filterAndRender()">
                <option value="">All risks</option>
                <option value="high">High (50+)</option>
                <option value="medium">Medium (25–49)</option>
                <option value="low">Low (&lt;25)</option>
              </select>
              <span class="result-count" id="resultCount">${fmt(total)} results</span>
            </div>
            <div class="accounts-table-wrap">
              <table class="accounts-table" id="accountsTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div id="clusterPagination" style="display:none;padding:10px 14px;border-top:1px solid var(--border);align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"></div>
          </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
          <!-- Quick facts -->
          <div class="card">
            <div class="card-header"><span class="card-title">Details</span></div>
            ${factsHtml}
          </div>

          <!-- Flag breakdown -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">Top Fraud Flags</span>
              <span class="card-count">${flagEntries.length}</span>
            </div>
            ${flagHtml}
          </div>
        </div>
      </div>
    `;

    buildTableHeaders();
    sortAndRender();
  }

  /* ── Table rendering ─────────────────────────────────── */
  function buildTableHeaders() {
    const cols = getColumns();
    document.getElementById('tableHead').innerHTML = `<tr>
      ${cols.map(c => `<th ${c.right ? 'class="right"' : ''} ${c.sortKey ? `data-sort="${c.sortKey}"` : ''} 
          onclick="sortBy('${c.sortKey || ''}')" title="${c.label}">${c.label}</th>`).join('')}
      <th style="width:24px"></th>
    </tr>`;
    // restore sort indicators
    document.querySelectorAll('#tableHead th[data-sort]').forEach(th => {
      if (th.dataset.sort === _sortKey) {
        th.classList.add(_sortDir < 0 ? 'sorted-desc' : 'sorted-asc');
      }
    });
  }

  function getColumns() {
    const base = [
      { label: 'Email',     key: 'email',         sortKey: 'email',         render: v => `<span style="max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(v||'—')}</span>` },
      { label: 'Risk',      key: 'risk_score',    sortKey: 'risk_score',    right: true, render: v => riskChip(v) },
      { label: 'Payout',    key: 'payout_amount', sortKey: 'payout_amount', right: true, render: v => fmtCur(v) },
      { label: 'Flags',     key: 'flags',                                   render: v => renderFlags(v) },
    ];
    if (CLUSTER_TYPE !== 'affiliate') {
      base.splice(3, 0, {
        label: 'Affiliate', key: 'webmaster_code', sortKey: 'webmaster_code',
        render: v => v ? `<a class="aff-link" href="/affiliate/${encodeURIComponent(v)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(v)} ↗</a>` : '<span style="color:var(--text-dim)">—</span>'
      });
    }
    if (CLUSTER_TYPE === 'name') {
      base.splice(1, 0, {
        label: 'DUID', key: 'duid', sortKey: 'duid',
        render: v => v ? `<span style="font-family:var(--mono);font-size:11px;color:var(--text-secondary)">${escapeHtml(String(v))}</span>` : '—'
      });
      base.splice(2, 0, {
        label: 'Processor ref', key: 'processor_subscriber_id',
        render: v => v ? `<span style="font-size:11px;color:var(--text-muted)" title="Payment processor subscriber / token ID — not the same as DUID">${escapeHtml(String(v))}</span>` : '—'
      });
    }
    if (CLUSTER_TYPE === 'domain') {
      base.splice(2, 0, {
        label: 'IP', key: 'ip', sortKey: 'ip',
        render: v => `<span style="color:var(--text-muted);font-size:11px">${escapeHtml(v||'—')}</span>`
      });
    }
    return base;
  }

  function filterAndRender() {
    const q    = document.getElementById('searchInput').value.toLowerCase();
    const risk = document.getElementById('riskFilter').value;

    _filteredAccounts = _allAccounts.filter(r => {
      const score = parseFloat(r.risk_score) || 0;
      if (risk === 'high'   && score < 50)  return false;
      if (risk === 'medium' && (score < 25 || score >= 50)) return false;
      if (risk === 'low'    && score >= 25) return false;
      if (q) {
        const haystack = [r.email, r.duid, r.webmaster_code, r.campaign, r.ip, r.first_name, r.last_name]
          .filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    sortAndRender();
  }

  function sortBy(key) {
    if (!key) return;
    if (_sortKey === key) _sortDir *= -1;
    else { _sortKey = key; _sortDir = -1; }
    buildTableHeaders();
    sortAndRender();
  }

  function sortAndRender() {
    const sorted = [..._filteredAccounts].sort((a, b) => {
      let av = a[_sortKey], bv = b[_sortKey];
      if (av == null || av === '') av = _sortDir < 0 ? -Infinity : Infinity;
      if (bv == null || bv === '') bv = _sortDir < 0 ? -Infinity : Infinity;
      if (typeof av === 'string' && typeof bv === 'string') return _sortDir * av.localeCompare(bv);
      return _sortDir * (parseFloat(av) - parseFloat(bv));
    });

    const cols = getColumns();
    document.getElementById('tableBody').innerHTML = sorted.length === 0
      ? `<tr><td colspan="${cols.length + 1}" style="text-align:center;padding:32px;color:var(--text-muted);">No accounts match filters</td></tr>`
      : sorted.map(r => `
          <tr onclick="openAccount('${escapeHtml(r.duid)}')">
            ${cols.map(c => `<td ${c.right ? 'class="right"' : ''} title="${escapeHtml(String(r[c.key]||''))}">${c.render ? c.render(r[c.key], r) : escapeHtml(String(r[c.key]||'—'))}</td>`).join('')}
            <td class="row-arrow">→</td>
          </tr>`).join('');

    const pg = _pagination || {};
    const total = pg.total != null ? pg.total : sorted.length;
    const page = pg.page || 1;
    const tpages = pg.total_pages || 1;
    document.getElementById('resultCount').textContent =
      `${fmt(sorted.length)} on this page · ${fmt(total)} total`;
    document.getElementById('tableCount').textContent = fmt(sorted.length);

    const pagEl = document.getElementById('clusterPagination');
    if (pagEl) {
      pagEl.style.display = total > 0 ? 'flex' : 'none';
      pagEl.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);">
          <span>Page <strong style="color:var(--text)">${page}</strong> of <strong style="color:var(--text)">${tpages}</strong></span>
          <button type="button" class="topbar-btn" ${page <= 1 ? 'disabled style="opacity:0.4"' : ''} onclick="changeClusterPage(-1)">← Prev</button>
          <button type="button" class="topbar-btn" ${page >= tpages ? 'disabled style="opacity:0.4"' : ''} onclick="changeClusterPage(1)">Next →</button>
          <label style="display:flex;align-items:center;gap:6px;margin-left:8px;">
            Rows/page
            <select id="clusterPerPage" class="topbar-btn" style="padding:4px 8px;cursor:pointer;" onchange="changePerPage(event)">
              <option value="50" ${(pg.per_page||100)===50?'selected':''}>50</option>
              <option value="100" ${(pg.per_page||100)===100?'selected':''}>100</option>
              <option value="200" ${(pg.per_page||100)===200?'selected':''}>200</option>
              <option value="500" ${(pg.per_page||100)===500?'selected':''}>500</option>
            </select>
          </label>
        </div>`;
    }
  }

  /* ── Account detail navigation ───────────────────────── */
  function openAccount(duid) {
    if (duid == null || duid === '' || duid === 'undefined' || duid === 'null') return;
    const s = String(duid).trim();
    if (!s) return;
    window.open(`/account/${encodeURIComponent(s)}`, '_blank');
  }

  /* ── Helpers ─────────────────────────────────────────── */
  function riskChip(v) {
    const score = parseFloat(v);
    if (isNaN(score)) return `<span class="risk-chip none">—</span>`;
    const cls = score >= 50 ? 'high' : score >= 25 ? 'medium' : 'low';
    return `<span class="risk-chip ${cls}">${score.toFixed(0)}</span>`;
  }

  function renderFlags(v) {
    if (!v) return '<span style="color:var(--text-dim)">—</span>';
    const raw = String(v).replace(/[\[\]']/g, '');
    const flags = raw.split(',').map(f => f.trim()).filter(Boolean);
    if (!flags.length) return '<span style="color:var(--text-dim)">—</span>';
    return flags.slice(0, 3).map(f =>
      `<span class="flag-chip">${f.toLowerCase().replace(/_/g,' ')}</span>`
    ).join('') + (flags.length > 3 ? `<span style="color:var(--text-muted);font-size:10px"> +${flags.length - 3}</span>` : '');
  }

  function fmt(n) {
    return n == null ? '0' : Number(n).toLocaleString();
  }
  function fmtCur(v) {
    const n = parseFloat(v) || 0;
    return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Export CSV ──────────────────────────────────────── */
  function exportCSV() {
    if (!_allAccounts.length) { showToast('No data to export'); return; }
    if ((_pagination.total || 0) > _allAccounts.length) {
      showToast('Note: CSV is this page only — use pagination to export other pages');
    }
    const cols = ['duid','email','risk_score','flags','payout_amount','webmaster_code','campaign','ip'];
    const header = cols.join(',');
    const rows = _allAccounts.map(r =>
      cols.map(c => `"${String(r[c]||'').replace(/"/g,'""')}"`).join(',')
    );
    const blob = new Blob([header + '\n' + rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `cluster_${CLUSTER_TYPE}_${CLUSTER_ID.slice(0,30)}.csv`;
    a.click();
    showToast('CSV downloaded');
  }

  /* ── Copy link ───────────────────────────────────────── */
  function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => showToast('Link copied'));
  }

  /* ── Toast ───────────────────────────────────────────── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2000);
  }

  /* ── Error state ─────────────────────────────────────── */
  function showError(msg) {
    document.getElementById('pageWrap').innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠</div>
        <div class="state-title">Failed to load cluster</div>
        <div class="state-desc">${escapeHtml(msg)}</div>
        <div style="margin-top:16px">
          <a href="/" class="topbar-btn" style="display:inline-flex;text-decoration:none;">← Back to Dashboard</a>
        </div>
      </div>`;
  }
</script>
</body>
</html>
