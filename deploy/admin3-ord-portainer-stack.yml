# Paste into Portainer → Stacks → Add stack (environment: admin3-ord)
# Set Environment variables from your local .env (see deploy/ADMIN3_ORD_PORTAINER.md)

services:
  web:
    image: registry.digitalocean.com/gpdocker/fraud-detection:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-5050}:5050"
    environment:
      PORT: "5050"
      HOST: "0.0.0.0"
      DB_PATH: /data/affiliate_data.db
      SKIP_EMBEDDED_SCHEDULER: "1"
      DEBUG: "0"
      WEB_CONCURRENCY: "1"
      GUNICORN_TIMEOUT: "120"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      REQUIRE_FLASK_SECRET_KEY: "1"
      FRAUD_DETECTION_API_KEY: ${FRAUD_DETECTION_API_KEY}
      WEBHOOK_INGEST_TOKEN: ${WEBHOOK_INGEST_TOKEN:-}
      ADMIN2_LOGIN_REQUIRED: ${ADMIN2_LOGIN_REQUIRED:-1}
      ADMIN_API_USERNAME: ${ADMIN_API_USERNAME:-}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD:-}
      LOG_TO_STDOUT_ONLY: "1"
      LOG_FORMAT: text
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      TRUST_PROXY_HTTPS: ${TRUST_PROXY_HTTPS:-1}
    volumes:
      - fraud_db:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health/live', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  scheduler:
    image: registry.digitalocean.com/gpdocker/fraud-detection:${IMAGE_TAG:-latest}
    command: ["python", "scheduler.py"]
    environment:
      DB_PATH: /data/affiliate_data.db
      FRAUD_DETECTION_API_KEY: ${FRAUD_DETECTION_API_KEY}
      ADMIN_API_USERNAME: ${ADMIN_API_USERNAME:-}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD:-}
      LOG_TO_STDOUT_ONLY: "1"
      LOG_FORMAT: text
    volumes:
      - fraud_db:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, sqlite3; sqlite3.connect(os.environ.get('DB_PATH','/data/affiliate_data.db'), timeout=5).execute('select 1')\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  fraud_db:
