services:
  # Dashboard + API only. Pipeline scheduling runs in the `scheduler` service.
  # Image: fraud-detection (DOCR e.g. registry.digitalocean.com/<registry>/fraud-detection:<tag>)
  web:
    build: .
    image: fraud-detection:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-5050}:5050"
    environment:
      PORT: "5050"
      HOST: "0.0.0.0"
      DB_PATH: /data/affiliate_data.db
      SKIP_EMBEDDED_SCHEDULER: "1"
      FRAUD_DETECTION_API_KEY: ${FRAUD_DETECTION_API_KEY:-}
      WEBHOOK_INGEST_TOKEN: ${WEBHOOK_INGEST_TOKEN:-}
      DEBUG: ${DEBUG:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      ADMIN2_LOGIN_REQUIRED: ${ADMIN2_LOGIN_REQUIRED:-1}
      ADMIN_API_USERNAME: ${ADMIN_API_USERNAME:-}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD:-}
      LOG_TO_STDOUT_ONLY: ${LOG_TO_STDOUT_ONLY:-1}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    volumes:
      - fraud_db:/data
    restart: unless-stopped

  scheduler:
    build: .
    image: fraud-detection:${IMAGE_TAG:-latest}
    command: ["python", "scheduler.py"]
    environment:
      DB_PATH: /data/affiliate_data.db
      FRAUD_DETECTION_API_KEY: ${FRAUD_DETECTION_API_KEY:-}
      ADMIN_API_USERNAME: ${ADMIN_API_USERNAME:-}
      ADMIN_API_PASSWORD: ${ADMIN_API_PASSWORD:-}
      LOG_TO_STDOUT_ONLY: ${LOG_TO_STDOUT_ONLY:-1}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    volumes:
      - fraud_db:/data
    restart: unless-stopped

volumes:
  fraud_db:
